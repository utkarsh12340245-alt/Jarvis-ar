<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>JARVIS AR Studio</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#02070d;
  color:#9eeaff;
  font-family:Arial,Helvetica,sans-serif;
}

#app{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:#02070d;
}

/* CAMERA */

#video{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  transform:scaleX(-1);
  opacity:.62;
}

#three{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  pointer-events:none;
}

#handCanvas,
#drawCanvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  pointer-events:none;
}

#handCanvas{
  z-index:4;
}

#drawCanvas{
  z-index:5;
}

/* HUD */

.hud{
  position:absolute;
  inset:0;
  z-index:10;
  pointer-events:none;
}

.topbar{
  position:absolute;
  top:10px;
  left:10px;
  right:10px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:18px;
  font-weight:bold;
  letter-spacing:3px;
  text-shadow:0 0 15px #00cfff;
}

.status{
  padding:6px 10px;
  border:1px solid #00cfff;
  border-radius:20px;
  background:#00141d99;
  font-size:11px;
}

.panel{
  position:absolute;
  width:185px;
  padding:12px;
  border:1px solid #00cfff88;
  border-radius:14px;
  background:#00131bcc;
  backdrop-filter:blur(8px);
  box-shadow:
    0 0 20px #00cfff22,
    inset 0 0 20px #00cfff0c;
  font-size:11px;
}

.left{
  top:55px;
  left:10px;
}

.right{
  top:55px;
  right:10px;
}

.panel h3{
  margin:0 0 8px;
  font-size:12px;
  color:#00d9ff;
  letter-spacing:1px;
}

.row{
  display:flex;
  justify-content:space-between;
  gap:8px;
  margin:5px 0;
}

.value{
  color:#fff;
  text-align:right;
}

/* CONTROLS */

.controls{
  position:absolute;
  z-index:20;
  left:8px;
  right:8px;
  bottom:8px;
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:6px;
  pointer-events:auto;
}

button,
select,
input{
  border:1px solid #00cfff88;
  background:#001923dd;
  color:#b9f5ff;
  border-radius:9px;
  padding:9px 10px;
  font-size:11px;
  outline:none;
}

button{
  cursor:pointer;
}

button:active{
  transform:scale(.96);
  background:#003747;
}

button.active{
  border-color:#00eaff;
  background:#00536b;
  box-shadow:0 0 12px #00cfff66;
}

.commandBox{
  position:absolute;
  z-index:30;
  left:10px;
  right:10px;
  bottom:58px;
  display:flex;
  gap:6px;
  pointer-events:auto;
}

.commandBox input{
  flex:1;
  min-width:0;
}

.help{
  position:absolute;
  z-index:15;
  bottom:110px;
  left:50%;
  transform:translateX(-50%);
  width:min(90%,430px);
  text-align:center;
  font-size:11px;
  color:#8edcec;
  text-shadow:0 0 10px #00cfff;
}

.toast{
  position:absolute;
  z-index:50;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  padding:12px 18px;
  border:1px solid #00eaff;
  border-radius:12px;
  background:#00131eee;
  box-shadow:0 0 25px #00cfff55;
  display:none;
  text-align:center;
  font-size:12px;
}

/* MOBILE */

@media(max-width:650px){
  .panel{
    width:150px;
    padding:9px;
  }

  .right{
    display:none;
  }

  .left{
    top:50px;
  }

  .logo{
    font-size:14px;
  }

  button{
    padding:8px 9px;
  }
}
</style>
</head>

<body>

<div id="app">

  <video id="video" autoplay muted playsinline></video>

  <canvas id="three"></canvas>

  <canvas id="handCanvas"></canvas>
  <canvas id="drawCanvas"></canvas>

  <div class="hud">

    <div class="topbar">
      <div class="logo">JARVIS // AR STUDIO</div>
      <div class="status" id="systemStatus">INITIALIZING</div>
    </div>

    <div class="panel left">
      <h3>HAND ANALYSIS</h3>

      <div class="row">
        <span>Hands</span>
        <span class="value" id="hands">0</span>
      </div>

      <div class="row">
        <span>Gesture</span>
        <span class="value" id="gesture">NONE</span>
      </div>

      <div class="row">
        <span>Confidence</span>
        <span class="value" id="confidence">0%</span>
      </div>

      <div class="row">
        <span>X</span>
        <span class="value" id="posX">0</span>
      </div>

      <div class="row">
        <span>Y</span>
        <span class="value" id="posY">0</span>
      </div>

      <div class="row">
        <span>Z</span>
        <span class="value" id="posZ">0</span>
      </div>

      <div class="row">
        <span>Speed</span>
        <span class="value" id="speed">0</span>
      </div>

      <div class="row">
        <span>Action</span>
        <span class="value" id="action">IDLE</span>
      </div>
    </div>

    <div class="panel right">
      <h3>JARVIS CORE</h3>

      <div class="row">
        <span>Mode</span>
        <span class="value" id="modeText">SELECT</span>
      </div>

      <div class="row">
        <span>AR</span>
        <span class="value" id="arText">FLOAT</span>
      </div>

      <div class="row">
        <span>Voice</span>
        <span class="value" id="voiceText">OFF</span>
      </div>

      <div class="row">
        <span>Object</span>
        <span class="value" id="objectText">NONE</span>
      </div>

      <div class="row">
        <span>Grid</span>
        <span class="value" id="gridText">ON</span>
      </div>

      <div class="row">
        <span>Lock</span>
        <span class="value" id="lockText">OFF</span>
      </div>
    </div>

  </div>

  <div class="help">
    INDEX = SELECT • PINCH = CONTROL • OPEN PALM = PAUSE •
    FIST = ERASE • TWO HANDS = SCALE
  </div>

  <div class="commandBox">
    <input id="commandInput"
           placeholder="Command: create robot / move left / rotate..."
           autocomplete="off">
    <button id="executeBtn">EXECUTE</button>
    <button id="voiceBtn">🎙 VOICE</button>
  </div>

  <div class="controls">

    <button data-mode="SELECT">SELECT</button>
    <button data-mode="MOVE">MOVE</button>
    <button data-mode="ROTATE">ROTATE</button>
    <button data-mode="SCALE">SCALE</button>
    <button data-mode="DRAW">DRAW</button>
    <button data-mode="ERASE">ERASE</button>

    <button id="createCube">CUBE</button>
    <button id="createSphere">SPHERE</button>
    <button id="createRobot">ROBOT</button>
    <button id="createCar">CAR</button>
    <button id="createHouse">HOUSE</button>
    <button id="createPyramid">PYRAMID</button>

    <button id="gridBtn">GRID</button>
    <button id="placeBtn">PLACE</button>
    <button id="centerBtn">CENTER</button>
    <button id="floatBtn">FLOAT</button>
    <button id="resetBtn">RESET</button>
    <button id="clearBtn">CLEAR</button>
    <button id="cameraBtn">GRANT CAMERA</button>

  </div>

  <div id="toast" class="toast"></div>

</div>


<!-- THREE.JS -->
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<!-- MEDIAPIPE -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>


<script>
/* =========================================================
   JARVIS AR STUDIO
   SINGLE FILE MASTER BUILD
   ========================================================= */

const video = document.getElementById("video");

const threeCanvas = document.getElementById("three");
const handCanvas = document.getElementById("handCanvas");
const drawCanvas = document.getElementById("drawCanvas");

const handCtx = handCanvas.getContext("2d");
const drawCtx = drawCanvas.getContext("2d");

const statusEl = document.getElementById("systemStatus");

const handsEl = document.getElementById("hands");
const gestureEl = document.getElementById("gesture");
const confidenceEl = document.getElementById("confidence");

const posXEl = document.getElementById("posX");
const posYEl = document.getElementById("posY");
const posZEl = document.getElementById("posZ");

const speedEl = document.getElementById("speed");
const actionEl = document.getElementById("action");

const modeText = document.getElementById("modeText");
const arText = document.getElementById("arText");
const voiceText = document.getElementById("voiceText");
const objectText = document.getElementById("objectText");
const gridText = document.getElementById("gridText");
const lockText = document.getElementById("lockText");

const commandInput = document.getElementById("commandInput");
const executeBtn = document.getElementById("executeBtn");
const voiceBtn = document.getElementById("voiceBtn");

const toast = document.getElementById("toast");


/* =========================================================
   STATE
   ========================================================= */

let mode = "SELECT";

let locked = false;
let gridVisible = true;

let arMode = "FLOAT";
let arPlaced = false;

let currentObject = null;

let lastTip = null;
let lastTime = performance.now();

let currentGesture = "NONE";
let currentConfidence = 0;

let handsDetected = 0;

let drawing = false;
let lastDrawPoint = null;

let voiceRecognition = null;
let voiceListening = false;

let floatTime = 0;


/* =========================================================
   UI
   ========================================================= */

function showToast(message){

  toast.textContent = message;
  toast.style.display = "block";

  clearTimeout(showToast.timer);

  showToast.timer = setTimeout(()=>{
    toast.style.display = "none";
  },1800);
}


function setStatus(text){

  statusEl.textContent = text;
}


function setMode(newMode){

  mode = newMode;

  modeText.textContent = mode;

  document.querySelectorAll("[data-mode]").forEach(btn=>{
    btn.classList.toggle(
      "active",
      btn.dataset.mode === mode
    );
  });

  showToast("MODE: " + mode);
}


document.querySelectorAll("[data-mode]").forEach(btn=>{

  btn.addEventListener("click",()=>{
    setMode(btn.dataset.mode);
  });

});


/* =========================================================
   THREE.JS
   ========================================================= */

const renderer = new THREE.WebGLRenderer({
  canvas:threeCanvas,
  alpha:true,
  antialias:true,
  powerPreference:"high-performance"
});

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio || 1,1.5)
);

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);


const scene = new THREE.Scene();


const camera3D = new THREE.PerspectiveCamera(
  60,
  window.innerWidth/window.innerHeight,
  .01,
  1000
);

camera3D.position.set(0,0,7);


const ambient = new THREE.AmbientLight(
  0xffffff,
  1.5
);

scene.add(ambient);


const pointLight = new THREE.PointLight(
  0x00cfff,
  4,
  30
);

pointLight.position.set(0,2,5);

scene.add(pointLight);


/* GRID */

const grid = new THREE.GridHelper(
  12,
  24,
  0x00cfff,
  0x063849
);

grid.rotation.x = Math.PI/2;

grid.position.z = -2;

scene.add(grid);


/* AXES */

const axes = new THREE.AxesHelper(2);

scene.add(axes);


/* =========================================================
   MATERIAL
   ========================================================= */

function hologramMaterial(){

  return new THREE.MeshStandardMaterial({
    color:0x00cfff,
    emissive:0x006d8a,
    emissiveIntensity:2,
    metalness:.2,
    roughness:.25,
    transparent:true,
    opacity:.72,
    wireframe:false
  });

}


/* =========================================================
   ADD OBJECT
   ========================================================= */

function addObject(mesh,name){

  if(currentObject){

    scene.remove(currentObject);

  }

  currentObject = mesh;

  currentObject.name = name;

  currentObject.position.set(0,0,-1);

  scene.add(currentObject);

  objectText.textContent = name.toUpperCase();

  showToast("CREATED: " + name.toUpperCase());
}


/* =========================================================
   OBJECT CREATORS
   ========================================================= */

function createCube(){

  const geometry =
    new THREE.BoxGeometry(1.5,1.5,1.5);

  addObject(
    new THREE.Mesh(
      geometry,
      hologramMaterial()
    ),
    "cube"
  );
}


function createSphere(){

  const geometry =
    new THREE.SphereGeometry(
      1,
      32,
      20
    );

  addObject(
    new THREE.Mesh(
      geometry,
      hologramMaterial()
    ),
    "sphere"
  );
}


function createPyramid(){

  const geometry =
    new THREE.ConeGeometry(
      1.2,
      2,
      4
    );

  addObject(
    new THREE.Mesh(
      geometry,
      hologramMaterial()
    ),
    "pyramid"
  );
}


function createCylinder(){

  const geometry =
    new THREE.CylinderGeometry(
      .9,
      .9,
      2,
      32
    );

  addObject(
    new THREE.Mesh(
      geometry,
      hologramMaterial()
    ),
    "cylinder"
  );
}


/* =========================================================
   ROBOT
   ========================================================= */

function createRobot(){

  const group = new THREE.Group();

  const mat = hologramMaterial();


  const body =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        1.4,
        1.8,
        .8
      ),
      mat
    );

  body.position.y = 0;

  group.add(body);


  const head =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        1.15,
        .9,
        .8
      ),
      mat
    );

  head.position.y = 1.35;

  group.add(head);


  const eyeMat =
    new THREE.MeshBasicMaterial({
      color:0x8fffff
    });


  const eye1 =
    new THREE.Mesh(
      new THREE.BoxGeometry(.25,.12,.08),
      eyeMat
    );

  const eye2 =
    eye1.clone();


  eye1.position.set(-.27,1.4,-.42);
  eye2.position.set(.27,1.4,-.42);

  group.add(eye1);
  group.add(eye2);


  const armGeo =
    new THREE.BoxGeometry(
      .35,
      1.5,
      .35
    );


  const arm1 =
    new THREE.Mesh(
      armGeo,
      mat
    );

  const arm2 =
    arm1.clone();


  arm1.position.set(
    -1,
    0,
    0
  );

  arm2.position.set(
    1,
    0,
    0
  );


  group.add(arm1);
  group.add(arm2);


  addObject(group,"robot");
}


/* =========================================================
   CAR
   ========================================================= */

function createCar(){

  const group = new THREE.Group();

  const mat = hologramMaterial();


  const body =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        2.8,
        .6,
        1.3
      ),
      mat
    );

  group.add(body);


  const cabin =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        1.4,
        .65,
        1.1
      ),
      mat
    );

  cabin.position.y = .6;

  group.add(cabin);


  const wheelGeo =
    new THREE.CylinderGeometry(
      .38,
      .38,
      .25,
      20
    );

  const wheelMat =
    new THREE.MeshStandardMaterial({
      color:0x002b3b,
      emissive:0x005d78,
      emissiveIntensity:1
    });


  const positions = [
    [-1,-.45,.7],
    [1,-.45,.7],
    [-1,-.45,-.7],
    [1,-.45,-.7]
  ];


  positions.forEach(p=>{

    const wheel =
      new THREE.Mesh(
        wheelGeo,
        wheelMat
      );

    wheel.rotation.z =
      Math.PI/2;

    wheel.position.set(
      p[0],
      p[1],
      p[2]
    );

    group.add(wheel);

  });


  addObject(group,"car");
}


/* =========================================================
   HOUSE
   ========================================================= */

function createHouse(){

  const group = new THREE.Group();

  const mat = hologramMaterial();


  const base =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        2.2,
        1.6,
        1.8
      ),
      mat
    );

  base.position.y = 0;

  group.add(base);


  const roof =
    new THREE.Mesh(
      new THREE.ConeGeometry(
        1.65,
        1.3,
        4
      ),
      mat
    );

  roof.rotation.y =
    Math.PI/4;

  roof.position.y = 1.4;

  group.add(roof);


  addObject(group,"house");
}


/* =========================================================
   BUTTONS
   ========================================================= */

document.getElementById("createCube")
  .onclick = createCube;

document.getElementById("createSphere")
  .onclick = createSphere;

document.getElementById("createRobot")
  .onclick = createRobot;

document.getElementById("createCar")
  .onclick = createCar;

document.getElementById("createHouse")
  .onclick = createHouse;

document.getElementById("createPyramid")
  .onclick = createPyramid;


/* =========================================================
   GRID
   ========================================================= */

document.getElementById("gridBtn")
.onclick = ()=>{

  gridVisible = !gridVisible;

  grid.visible = gridVisible;
  axes.visible = gridVisible;

  gridText.textContent =
    gridVisible ? "ON" : "OFF";

};


/* =========================================================
   OBJECT RESET
   ========================================================= */

function resetObject(){

  if(!currentObject) return;

  currentObject.position.set(
    0,
    0,
    -1
  );

  currentObject.rotation.set(
    0,
    0,
    0
  );

  currentObject.scale.set(
    1,
    1,
    1
  );

  showToast("OBJECT RESET");
}


document.getElementById("resetBtn")
.onclick = resetObject;


/* =========================================================
   CLEAR
   ========================================================= */

document.getElementById("clearBtn")
.onclick = ()=>{

  if(currentObject){

    scene.remove(currentObject);

    currentObject = null;

  }

  objectText.textContent = "NONE";

  drawCtx.clearRect(
    0,
    0,
    drawCanvas.width,
    drawCanvas.height
  );

  showToast("WORKSPACE CLEARED");
};


/* =========================================================
   CAMERA
   ========================================================= */

async function startCamera(){

  try{

    const stream =
      await navigator.mediaDevices.getUserMedia({

        video:{
          facingMode:"user",
          width:{
            ideal:1280
          },
          height:{
            ideal:720
          }
        },

        audio:false

      });

    video.srcObject = stream;

    setStatus("CAMERA ONLINE");

    showToast("CAMERA ONLINE");

  }catch(error){

    console.error(error);

    setStatus("CAMERA BLOCKED");

    showToast(
      "Camera permission required"
    );

  }

}


document.getElementById("cameraBtn")
.onclick = startCamera;


/* =========================================================
   CANVAS SIZE
   ========================================================= */

function resizeCanvases(){

  const w = window.innerWidth;
  const h = window.innerHeight;

  handCanvas.width = w;
  handCanvas.height = h;

  drawCanvas.width = w;
  drawCanvas.height = h;

  renderer.setSize(w,h);

  camera3D.aspect = w/h;

  camera3D.updateProjectionMatrix();

}


window.addEventListener(
  "resize",
  resizeCanvases
);

resizeCanvases();


/* =========================================================
   HAND TRACKING
   ========================================================= */

const mpHands =
  new Hands({

    locateFile:(file)=>{

      return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;

    }

  });


mpHands.setOptions({

  maxNumHands:2,

  modelComplexity:1,

  minDetectionConfidence:.55,

  minTrackingConfidence:.55

});


mpHands.onResults(onHands);


/* =========================================================
   CAMERA LOOP
   ========================================================= */

let mpCamera = null;


function startHandCamera(){

  if(!window.Camera){

    showToast(
      "MediaPipe camera unavailable"
    );

    return;

  }


  mpCamera =
    new Camera(
      video,
      {

        onFrame:async()=>{

          await mpHands.send({
            image:video
          });

        },

        width:1280,
        height:720

      }
    );


  mpCamera.start();

}


startCamera().then(()=>{
  startHandCamera();
});


/* =========================================================
   LANDMARK HELPERS
   ========================================================= */

function distance(a,b){

  return Math.hypot(
    a.x-b.x,
    a.y-b.y,
    a.z-b.z
  );

}


function fingerExtended(
  landmarks,
  tip,
  pip
){

  return landmarks[tip].y <
         landmarks[pip].y;

}


/* =========================================================
   GESTURE DETECTION
   ========================================================= */

function detectGesture(lm){

  if(!lm) return "NONE";


  const pinch =
    distance(
      lm[4],
      lm[8]
    );


  const index =
    fingerExtended(
      lm,
      8,
      6
    );


  const middle =
    fingerExtended(
      lm,
      12,
      10
    );


  const ring =
    fingerExtended(
      lm,
      16,
      14
    );


  const pinky =
    fingerExtended(
      lm,
      20,
      18
    );


  if(pinch < .065){

    return "PINCH";

  }


  if(
    index &&
    !middle &&
    !ring &&
    !pinky
  ){

    return "INDEX";

  }


  if(
    index &&
    middle &&
    ring &&
    pinky
  ){

    return "OPEN PALM";

  }


  if(
    !index &&
    !middle &&
    !ring &&
    !pinky
  ){

    return "FIST";

  }


  return "HAND";

}


/* =========================================================
   DRAW HAND
   ========================================================= */

function drawHand(lm){

  handCtx.clearRect(
    0,
    0,
    handCanvas.width,
    handCanvas.height
  );


  if(!lm) return;


  handCtx.lineWidth = 2;

  handCtx.strokeStyle =
    "rgba(0,220,255,.75)";

  handCtx.fillStyle =
    "#8fffff";


  const connections = [

    [0,1],[1,2],[2,3],[3,4],

    [0,5],[5,6],[6,7],[7,8],

    [5,9],[9,10],[10,11],[11,12],

    [9,13],[13,14],[14,15],[15,16],

    [13,17],[17,18],[18,19],[19,20],

    [0,17]

  ];


  connections.forEach(pair=>{

    const a = lm[pair[0]];
    const b = lm[pair[1]];


    handCtx.beginPath();

    handCtx.moveTo(
      a.x*handCanvas.width,
      a.y*handCanvas.height
    );

    handCtx.lineTo(
      b.x*handCanvas.width,
      b.y*handCanvas.height
    );

    handCtx.stroke();

  });


  lm.forEach(p=>{

    handCtx.beginPath();

    handCtx.arc(
      p.x*handCanvas.width,
      p.y*handCanvas.height,
      4,
      0,
      Math.PI*2
    );

    handCtx.fill();

  });

}


/* =========================================================
   HAND RESULTS
   ========================================================= */

function onHands(results){

  const lists =
    results.multiHandLandmarks || [];

  handsDetected =
    lists.length;

  handsEl.textContent =
    handsDetected;


  if(!lists.length){

    currentGesture = "NONE";

    gestureEl.textContent = "NONE";

    confidenceEl.textContent = "0%";

    actionEl.textContent = "SEARCHING";

    handCtx.clearRect(
      0,
      0,
      handCanvas.width,
      handCanvas.height
    );

    return;

  }


  const lm = lists[0];

  drawHand(lm);


  currentGesture =
    detectGesture(lm);


  gestureEl.textContent =
    currentGesture;


  currentConfidence =
    Math.min(
      99,
      Math.round(
        55 + Math.random()*40
      )
    );


  confidenceEl.textContent =
    currentConfidence + "%";


  const tip = lm[8];


  const x = tip.x;
  const y = tip.y;
  const z = tip.z;


  posXEl.textContent =
    x.toFixed(2);

  posYEl.textContent =
    y.toFixed(2);

  posZEl.textContent =
    z.toFixed(2);


  const now =
    performance.now();


  if(lastTip){

    const dx =
      x-lastTip.x;

    const dy =
      y-lastTip.y;

    const dz =
      z-lastTip.z;


    const dt =
      Math.max(
        .001,
        (now-lastTime)/1000
      );


    const speed =
      Math.sqrt(
        dx*dx+
        dy*dy+
        dz*dz
      ) / dt;


    speedEl.textContent =
      speed.toFixed(2);


    analyzeMovement(
      x,
      y,
      z,
      dx,
      dy,
      dz,
      speed
    );

  }


  lastTip = {
    x:x,
    y:y,
    z:z
  };


  lastTime = now;


  controlObject(
    lm,
    currentGesture
  );


  controlDrawing(
    lm,
    currentGesture
  );


  if(lists.length >= 2){

    twoHandControl(
      lists[0],
      lists[1]
    );

  }

}


/* =========================================================
   MOVEMENT ANALYSIS
   ========================================================= */

function analyzeMovement(
  x,
  y,
  z,
  dx,
  dy,
  dz,
  speed
){

  let direction = "STILL";


  if(Math.abs(dx) > .015){

    direction =
      dx > 0
      ? "RIGHT"
      : "LEFT";

  }else if(Math.abs(dy) > .015){

    direction =
      dy > 0
      ? "DOWN"
      : "UP";

  }


  actionEl.textContent =
    direction;

}


/* =========================================================
   HAND → 3D
   ========================================================= */

function handToWorld(lm){

  const tip = lm[8];


  const x =
    (tip.x-.5)*7;


  const y =
    -(tip.y-.5)*5;


  const z =
    THREE.MathUtils.clamp(
      -tip.z*10,
      -3,
      3
    );


  return {
    x:x,
    y:y,
    z:z
  };

}


/* =========================================================
   OBJECT CONTROL
   ========================================================= */

function controlObject(
  lm,
  gesture
){

  if(!currentObject) return;

  if(locked) return;


  if(
    gesture === "PINCH" ||
    gesture === "INDEX"
  ){

    const p =
      handToWorld(lm);


    if(mode === "MOVE"){

      currentObject.position.x =
        THREE.MathUtils.lerp(
          currentObject.position.x,
          p.x,
          .15
        );


      currentObject.position.y =
        THREE.MathUtils.lerp(
          currentObject.position.y,
          p.y,
          .15
        );


      currentObject.position.z =
        THREE.MathUtils.lerp(
          currentObject.position.z,
          p.z-1,
          .1
        );

    }


    if(mode === "ROTATE"){

      currentObject.rotation.y +=
        (p.x-currentObject.position.x)
        *.025;

      currentObject.rotation.x +=
        (p.y-currentObject.position.y)
        *.025;

    }


    if(mode === "SCALE"){

      const scale =
        THREE.MathUtils.clamp(
          1-p.z*.3,
          .35,
          3
        );

      currentObject.scale.setScalar(
        scale
      );

    }

  }

}


/* =========================================================
   TWO HAND CONTROL
   ========================================================= */

function twoHandControl(a,b){

  if(!currentObject) return;

  if(locked) return;


  const d =
    distance(a,b);


  if(mode === "SCALE"){

    const scale =
      THREE.MathUtils.clamp(
        d*4,
        .35,
        3
      );


    currentObject.scale.lerp(
      new THREE.Vector3(
        scale,
        scale,
        scale
      ),
      .1
    );

  }


  if(mode === "MOVE"){

    const cx =
      (a.x+b.x)/2;

    const cy =
      (a.y+b.y)/2;


    currentObject.position.x =
      (cx-.5)*7;

    currentObject.position.y =
      -(cy-.5)*5;

  }

}


/* =========================================================
   DRAWING
   ========================================================= */

function controlDrawing(
  lm,
  gesture
){

  if(mode !== "DRAW" &&
     mode !== "ERASE"){

    lastDrawPoint = null;

    return;

  }


  const tip = lm[8];


  const x =
    tip.x*drawCanvas.width;

  const y =
    tip.y*drawCanvas.height;


  if(
    mode === "ERASE" ||
    gesture === "FIST"
  ){

    drawCtx.save();

    drawCtx.globalCompositeOperation =
      "destination-out";

    drawCtx.beginPath();

    drawCtx.arc(
      x,
      y,
      30,
      0,
      Math.PI*2
    );

    drawCtx.fill();

    drawCtx.restore();

    lastDrawPoint = null;

    return;

  }


  if(
    mode === "DRAW" &&
    gesture === "INDEX"
  ){

    if(lastDrawPoint){

      drawCtx.save();

      drawCtx.globalCompositeOperation =
        "source-over";

      drawCtx.strokeStyle =
        "#5fefff";

      drawCtx.shadowColor =
        "#00d9ff";

      drawCtx.shadowBlur =
        18;

      drawCtx.lineWidth = 5;

      drawCtx.lineCap = "round";

      drawCtx.beginPath();

      drawCtx.moveTo(
        lastDrawPoint.x,
        lastDrawPoint.y
      );

      drawCtx.lineTo(
        x,
        y
      );

      drawCtx.stroke();

      drawCtx.restore();

    }


    lastDrawPoint = {
      x:x,
      y:y
    };

  }else{

    lastDrawPoint = null;

  }

}


/* =========================================================
   LOCK
   ========================================================= */

function toggleLock(){

  locked = !locked;

  lockText.textContent =
    locked ? "ON" : "OFF";

}


document.addEventListener(
  "keydown",
  e=>{

    if(e.key.toLowerCase()==="l"){

      toggleLock();

    }

  }
);


/* =========================================================
   AR STYLE CONTROLS
   ========================================================= */

function placeAR(){

  if(!currentObject){

    showToast(
      "Create an object first"
    );

    return;

  }


  arMode = "PLACED";

  arPlaced = true;

  arText.textContent =
    "PLACED";

  showToast(
    "HOLOGRAM PLACED"
  );

}


function centerAR(){

  if(!currentObject) return;


  currentObject.position.set(
    0,
    0,
    -1
  );

  showToast(
    "CENTERED"
  );

}


function floatAR(){

  arMode = "FLOAT";

  arPlaced = false;

  arText.textContent =
    "FLOAT";

  showToast(
    "FLOAT MODE"
  );

}


function resetAR(){

  if(!currentObject) return;

  currentObject.position.set(
    0,
    0,
    -1
  );

  currentObject.rotation.set(
    0,
    0,
    0
  );

  currentObject.scale.set(
    1,
    1,
    1
  );

  arMode = "FLOAT";

  arText.textContent =
    "FLOAT";

}


document.getElementById("placeBtn")
.onclick = placeAR;

document.getElementById("centerBtn")
.onclick = centerAR;

document.getElementById("floatBtn")
.onclick = floatAR;


/* =========================================================
   COMMAND ENGINE
   ========================================================= */

function runCommand(raw){

  const text =
    raw
    .toLowerCase()
    .trim();


  if(!text) return;


  /* CREATION */

  if(
    text.includes("robot") ||
    text.includes("android")
  ){

    createRobot();
    return;

  }


  if(text.includes("car")){

    createCar();
    return;

  }


  if(text.includes("house")){

    createHouse();
    return;

  }


  if(text.includes("sphere") ||
     text.includes("ball")){

    createSphere();
    return;

  }


  if(text.includes("cube")){

    createCube();
    return;

  }


  if(text.includes("pyramid")){

    createPyramid();
    return;

  }


  if(text.includes("cylinder")){

    createCylinder();
    return;

  }


  /* MOVEMENT */

  if(!currentObject){

    showToast(
      "Create an object first"
    );

    return;

  }


  if(
    text.includes("move left")
  ){

    currentObject.position.x -= .5;

    return;

  }


  if(
    text.includes("move right")
  ){

    currentObject.position.x += .5;

    return;

  }


  if(
    text.includes("move up")
  ){

    currentObject.position.y += .5;

    return;

  }


  if(
    text.includes("move down")
  ){

    currentObject.position.y -= .5;

    return;

  }


  if(
    text.includes("forward") ||
    text.includes("closer")
  ){

    currentObject.position.z += .5;

    return;

  }


  if(
    text.includes("back") ||
    text.includes("farther")
  ){

    currentObject.position.z -= .5;

    return;

  }


  /* ROTATION */

  if(
    text.includes("rotate left")
  ){

    currentObject.rotation.y -= .3;

    return;

  }


  if(
    text.includes("rotate right")
  ){

    currentObject.rotation.y += .3;

    return;

  }


  if(
    text.includes("rotate up")
  ){

    currentObject.rotation.x -= .3;

    return;

  }


  if(
    text.includes("rotate down")
  ){

    currentObject.rotation.x += .3;

    return;

  }


  /* SCALE */

  if(
    text.includes("bigger") ||
    text.includes("zoom in") ||
    text.includes("increase")
  ){

    currentObject.scale.multiplyScalar(
      1.2
    );

    return;

  }


  if(
    text.includes("smaller") ||
    text.includes("zoom out") ||
    text.includes("decrease")
  ){

    currentObject.scale.multiplyScalar(
      .8
    );

    return;

  }


  /* MODES */

  if(text.includes("move mode")){

    setMode("MOVE");
    return;

  }


  if(text.includes("rotate mode")){

    setMode("ROTATE");
    return;

  }


  if(text.includes("scale mode")){

    setMode("SCALE");
    return;

  }


  if(text.includes("draw mode")){

    setMode("DRAW");
    return;

  }


  /* AR */

  if(
    text.includes("place") ||
    text.includes("show hologram")
  ){

    placeAR();
    return;

  }


  if(text.includes("center")){

    centerAR();
    return;

  }


  if(text.includes("float")){

    floatAR();
    return;

  }


  /* RESET */

  if(
    text.includes("reset")
  ){

    resetObject();
    return;

  }


  /* CLEAR */

  if(
    text.includes("clear") ||
    text.includes("delete") ||
    text.includes("remove")
  ){

    document.getElementById(
      "clearBtn"
    ).click();

    return;

  }


  if(text.includes("lock")){

    if(!locked) toggleLock();

    return;

  }


  if(text.includes("unlock")){

    if(locked) toggleLock();

    return;

  }


  if(text.includes("grid")){

    document.getElementById(
      "gridBtn"
    ).click();

    return;

  }


  showToast(
    "Command not recognized"
  );

}


/* =========================================================
   TEXT COMMAND
   ========================================================= */

executeBtn.onclick = ()=>{

  const command =
    commandInput.value;

  runCommand(command);

  commandInput.value = "";

};


commandInput.addEventListener(
  "keydown",
  e=>{

    if(e.key === "Enter"){

      executeBtn.click();

    }

  }
);


/* =========================================================
   VOICE
   ========================================================= */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


if(SpeechRecognition){

  voiceRecognition =
    new SpeechRecognition();


  voiceRecognition.continuous =
    false;

  voiceRecognition.interimResults =
    false;

  voiceRecognition.lang =
    "en-IN";


  voiceRecognition.onstart = ()=>{

    voiceListening = true;

    voiceText.textContent =
      "LISTENING";

    voiceBtn.classList.add(
      "active"
    );

    setStatus(
      "VOICE LISTENING"
    );

  };


  voiceRecognition.onresult =
    event=>{

      const text =
        event
        .results[0][0]
        .transcript;


      commandInput.value =
        text;


      runCommand(text);

    };


  voiceRecognition.onerror =
    event=>{

      console.log(
        "Voice error:",
        event.error
      );

      showToast(
        "Voice error: " +
        event.error
      );

    };


  voiceRecognition.onend = ()=>{

    voiceListening = false;

    voiceText.textContent =
      "OFF";

    voiceBtn.classList.remove(
      "active"
    );

    setStatus(
      "SYSTEM ONLINE"
    );

  };


  voiceBtn.onclick = ()=>{

    try{

      if(voiceListening){

        voiceRecognition.stop();

      }else{

        voiceRecognition.start();

      }

    }catch(error){

      console.log(error);

    }

  };

}else{

  voiceBtn.onclick = ()=>{

    showToast(
      "Voice recognition unavailable"
    );

  };

}


/* =========================================================
   SPEECH OUTPUT
   ========================================================= */

function jarvisSpeak(text){

  if(!window.speechSynthesis)
    return;


  const speech =
    new SpeechSynthesisUtterance(
      text
    );


  speech.lang = "en-IN";

  speech.rate = .95;

  speech.pitch = .85;

  window.speechSynthesis.cancel();

  window.speechSynthesis.speak(
    speech
  );

}


/* =========================================================
   FLOATING HOLOGRAM
   ========================================================= */

function updateAR(){

  if(
    currentObject &&
    arMode === "FLOAT" &&
    !locked
  ){

    floatTime += .025;

    currentObject.position.y +=
      Math.sin(floatTime)*.0015;

  }

}


/* =========================================================
   RENDER LOOP
   ========================================================= */

function animate(){

  requestAnimationFrame(
    animate
  );


  if(currentObject){

    /* subtle hologram rotation */

    currentObject.rotation.z +=
      .0008;

  }


  updateAR();


  renderer.render(
    scene,
    camera3D
  );

}


animate();


/* =========================================================
   INITIALIZE
   ========================================================= */

setMode("SELECT");

setStatus(
  "SYSTEM ONLINE"
);


/* =========================================================
   TOUCH FALLBACK
   ========================================================= */

let touchStart = null;


threeCanvas.style.pointerEvents =
  "auto";


threeCanvas.addEventListener(
  "touchstart",
  e=>{

    if(!currentObject) return;

    const t =
      e.touches[0];

    touchStart = {
      x:t.clientX,
      y:t.clientY
    };

  },
  {passive:true}
);


threeCanvas.addEventListener(
  "touchmove",
  e=>{

    if(
      !currentObject ||
      !touchStart ||
      locked
    ) return;


    const t =
      e.touches[0];


    const dx =
      t.clientX-touchStart.x;

    const dy =
      t.clientY-touchStart.y;


    if(mode === "MOVE"){

      currentObject.position.x +=
        dx*.01;

      currentObject.position.y -=
        dy*.01;

    }


    if(mode === "ROTATE"){

      currentObject.rotation.y +=
        dx*.01;

      currentObject.rotation.x +=
        dy*.01;

    }


    if(mode === "SCALE"){

      currentObject.scale.multiplyScalar(
        1-dy*.001
      );

    }


    touchStart = {
      x:t.clientX,
      y:t.clientY
    };

  },
  {passive:true}
);


threeCanvas.addEventListener(
  "touchend",
  ()=>{
    touchStart = null;
  }
);


/* =========================================================
   JARVIS STARTUP
   ========================================================= */

setTimeout(()=>{

  jarvisSpeak(
    "JARVIS system online."
  );

},1500);

</script>
